<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SolidMove App</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --primary: #00d4ff;
        --secondary: #7b2ffc;
        --dark: #0a0a1a;
        --darker: #050510;
        --light: #ffffff;
        --gray: #8892b0;
        --card-bg: rgba(255,255,255,0.03);
        --border: rgba(255,255,255,0.08);
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent;}
    body { background: var(--dark); color: var(--light); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .screen { display: none; height: 100%; overflow-y: auto; padding: 24px; }
    .screen.active { display: block; }
    
    .login-wrapper { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; }
    .logo-circle { width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 24px; display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: 900; color: #fff; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3); }
    
    .app-title { font-size: 28px; font-weight: 900; letter-spacing: -1px; margin-bottom: 8px; }
    .app-subtitle { font-size: 14px; color: var(--gray); margin-bottom: 32px; text-align: center; }
    
    .input-group { width: 100%; max-width: 340px; margin-bottom: 16px; }
    .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--gray); margin-bottom: 8px; margin-left: 4px; }
    .input-group input { width: 100%; padding: 16px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; color: var(--light); font-size: 15px; transition: 0.3s; }
    .input-group input:focus { outline: none; border-color: var(--primary); background: rgba(0,212,255,0.05); }
    
    .btn-primary { width: 100%; max-width: 340px; padding: 16px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border: none; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; box-shadow: 0 10px 20px rgba(123, 47, 252, 0.2); transition: 0.3s; }
    .btn-primary:active { transform: scale(0.98); }
    
    .app-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .app-header h2 { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px;}
    .avatar { width: 40px; height: 40px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 700; color: var(--primary); }
    
    .wallet-card { background: linear-gradient(135deg, rgba(0,212,255,0.08), rgba(123,47,252,0.08)); border: 1px solid rgba(0,212,255,0.2); border-radius: 24px; padding: 24px; margin-bottom: 24px; position: relative; overflow: hidden; }
    .wallet-card::before { content: ''; position: absolute; top: -50%; right: -20%; width: 150px; height: 150px; background: radial-gradient(circle, rgba(0,212,255,0.2), transparent 70%); border-radius: 50%; }
    .w-label { font-size: 12px; color: var(--gray); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
    .w-amount { font-size: 38px; font-weight: 900; letter-spacing: -1px; }
    .w-amount span { font-size: 20px; color: var(--gray); font-weight: 600; }
    
    .action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 32px; }
    .action-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .action-icon { width: 60px; height: 60px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; display: flex; justify-content: center; align-items: center; font-size: 24px; }
    .action-item span { font-size: 12px; color: var(--gray); font-weight: 600; }
    
    .osa-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; height: 320px; }
    .osa-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-weight: 700; font-size: 16px; }
    .osa-status { width: 8px; height: 8px; background: #00e676; border-radius: 50%; box-shadow: 0 0 10px #00e676; }
    
    .chat-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 5px; }
    .chat-area::-webkit-scrollbar { display: none; }
    .msg { padding: 12px 16px; border-radius: 16px; font-size: 14px; max-width: 85%; line-height: 1.5; }
    .msg.bot { background: rgba(0,212,255,0.1); color: var(--light); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid rgba(0,212,255,0.15); }
    .msg.user { background: linear-gradient(135deg, var(--secondary), var(--primary)); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    
    .chat-input-wrapper { display: flex; gap: 8px; margin-top: 16px; background: rgba(0,0,0,0.3); border-radius: 16px; padding: 6px; border: 1px solid var(--border); }
    .chat-input-wrapper input { flex: 1; background: transparent; border: none; padding: 10px; color: var(--light); font-size: 14px; }
    .chat-input-wrapper input:focus { outline: none; }
    .chat-input-wrapper button { width: 40px; height: 40px; border-radius: 12px; background: var(--primary); border: none; color: var(--dark); font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    
    .loading-dots { display: none; }
    .loading-dots span { display: inline-block; width: 6px; height: 6px; background: var(--gray); border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both; }
    .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
    .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 70px; background: rgba(10,10,26,0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding-bottom: 10px; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--gray); text-decoration: none; font-size: 11px; font-weight: 600; }
    .nav-item.active { color: var(--primary); }
    .nav-item i { font-style: normal; font-size: 20px; }
</style>
</head>
<body>

<div id="login-screen" class="screen active">
    <div class="login-wrapper">
        <div class="logo-circle">◆</div>
        <h1 class="app-title">SolidMove</h1>
        <p class="app-subtitle">Your digital ecosystem.</p>
        
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="ceo@solidmove.tech">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        
        <button class="btn-primary" id="login-btn" onclick="login()">Log In</button>
        <div class="loading-dots" id="login-loader" style="margin-top:20px; text-align:center;">
            <span></span><span></span><span></span>
        </div>
    </div>
</div>

<div id="app-screen" class="screen" style="padding-bottom: 90px;">
    <div class="app-header">
        <h2>SolidMove <span style="font-size:10px; color:var(--primary); background:rgba(0,212,255,0.1); padding:4px 8px; border-radius:6px;">BETA</span></h2>
        <div class="avatar" onclick="logout()">S</div>
    </div>

    <div class="wallet-card">
        <div class="w-label">Total Balance</div>
        <div class="w-amount"><span>₦</span><span id="wallet-balance">0.00</span></div>
        <div style="margin-top:16px; font-size:12px; color:var(--gray); display:flex; justify-content:space-between;">
            <span>Account: <strong id="user-email" style="color:var(--light);">...</strong></span>
            <span>DPY Core</span>
        </div>
    </div>

    <div class="action-grid">
        <div class="action-item"><div class="action-icon">↑</div><span>Send</span></div>
        <div class="action-item"><div class="action-icon">↓</div><span>Receive</span></div>
        <div class="action-item"><div class="action-icon">📄</div><span>Invoice</span></div>
        <div class="action-item"><div class="action-icon">⋯</div><span>More</span></div>
    </div>

    <div class="osa-container">
        <div class="osa-header">
            <div class="osa-status"></div> OSA Assistant
        </div>
        
        <div class="chat-area" id="chat-area">
            <div class="msg bot">Welcome back, CEO. I am OSA. Your DPY engine is online. How can I assist you today?</div>
        </div>
        
        <div class="chat-input-wrapper">
            <input type="text" id="chat-input" placeholder="Ask OSA anything..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">→</button>
        </div>
    </div>
</div>

<div id="bottom-nav" class="bottom-nav" style="display:none;">
    <a href="#" class="nav-item active"><i>🏠</i>Home</a>
    <a href="#" class="nav-item"><i>💳</i>Wallet</a>
    <a href="#" class="nav-item"><i>🧠</i>OSA</a>
    <a href="#" class="nav-item"><i>👤</i>Profile</a>
</div>

<script>
    const API_URL = "https://dpy-core-api.onrender.com"; 

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('login-btn');
        const loader = document.getElementById('login-loader');

        if(!email || !password) return alert("Enter email and password");

        btn.style.display = 'none';
        loader.style.display = 'block';

        try {
            const response = await fetch(`${API_URL}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('email', data.user.email);
                
                document.getElementById('login-screen').classList.remove('active');
                document.getElementById('app-screen').classList.add('active');
                document.getElementById('bottom-nav').style.display = 'flex';
                document.getElementById('user-email').innerText = data.user.email;
                
                loadWallet(data.access_token);
            } else {
                alert("Login failed. Check your credentials.");
            }
        } catch (error) {
            alert("Network error. Render might be waking up. Wait 30 seconds and try again.");
        } finally {
            btn.style.display = 'block';
            loader.style.display = 'none';
        }
    }

    async function loadWallet(token) {
        try {
            const response = await fetch(`${API_URL}/wallet/me`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
                const data = await response.json();
                document.getElementById('wallet-balance').innerText = data.balance.toFixed(2);
            }
        } catch (e) {
            console.log("Wallet error.");
        }
    }

    function sendMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value;
        if(!text) return;

        const chatArea = document.getElementById('chat-area');
        
        chatArea.innerHTML += `<div class="msg user">${text}</div>`;
        input.value = '';
        chatArea.scrollTop = chatArea.scrollHeight;

        setTimeout(() => {
            chatArea.innerHTML += `<div class="msg bot">OSA: I am processing your command via DPY Core. Full AI routing is being activated.</div>`;
            chatArea.scrollTop = chatArea.scrollHeight;
        }, 1000);
    }

    function handleKeyPress(e) {
        if(e.key === 'Enter') sendMessage();
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('email');
        document.getElementById('app-screen').classList.remove('active');
        document.getElementById('login-screen').classList.add('active');
        document.getElementById('bottom-nav').style.display = 'none';
        document.getElementById('email').value = '';
        document.getElementById('password').value = '';
    }

    if(localStorage.getItem('token')) {
        document.getElementById('login-screen').classList.remove('active');
        document.getElementById('app-screen').classList.add('active');
        document.getElementById('bottom-nav').style.display = 'flex';
        document.getElementById('user-email').innerText = localStorage.getItem('email');
        loadWallet(localStorage.getItem('token'));
    }
</script>
</body>
                                   </html>
